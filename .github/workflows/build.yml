name: Build Green Star APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare baseline WebView app
        run: |
          unzip -o Green-Star-Android-Source.zip
          mkdir -p assets/www assets
          cp www/index.html assets/www/index.html
          echo "===== PDF-related source inspection ====="
          grep -nEi -C 5 'pdfInput|pdfjsLibReady|pdfData|pdfZoom|pdfObjectUrl|renderPdf|loadPdf|removePdfBtn|workerSrc' www/index.html | awk 'length($0) < 4000' | tail -n 220 || true
          echo "===== End PDF-related source inspection ====="
          cp logo.png assets/app_icon.png
          flutter create --platforms=android --org com.greenstar --project-name green_star .
          cat > pubspec.yaml <<'EOF'
          name: green_star
          description: Green Star Android app
          publish_to: 'none'
          version: 1.0.2+4
          environment:
            sdk: '>=3.8.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
            webview_flutter_android: ^4.10.0
            file_picker: ^10.3.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
            flutter_launcher_icons: ^0.14.4
          flutter:
            uses-material-design: true
            assets:
              - assets/www/
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/app_icon.png
            adaptive_icon_background: "#ffffff"
            adaptive_icon_foreground: assets/app_icon.png
          EOF
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:file_picker/file_picker.dart';

          void main() => runApp(const GreenStarApp());

          class GreenStarApp extends StatelessWidget {
            const GreenStarApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: GreenStarHome(),
              );
            }
          }

          class GreenStarHome extends StatefulWidget {
            const GreenStarHome({super.key});

            @override
            State<GreenStarHome> createState() => _GreenStarHomeState();
          }

          class _GreenStarHomeState extends State<GreenStarHome> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFFFFFFF))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (url) async {
                      await controller.runJavaScript(r"""
                        (() => {
                          const removeUnwantedControls = () => {
                            document.querySelectorAll('button, input, a, [role="button"]').forEach((el) => {
                              const label = ((el.innerText || el.value || el.getAttribute('aria-label') || '') + '')
                                .replace(/\s+/g, ' ').trim();
                              if (/پرینت|چاپ/.test(label) ||
                                  /خروجی/.test(label) ||
                                  /ورودی/.test(label)) {
                                el.style.setProperty('display', 'none', 'important');
                              }
                            });
                          };
                          removeUnwantedControls();
                          new MutationObserver(removeUnwantedControls).observe(document.documentElement, {
                            childList: true, subtree: true, characterData: true
                          });
                        })();
                      """);
                    },
                  ),
                )
                ..loadFlutterAsset('assets/www/index.html');

              if (controller.platform is AndroidWebViewController) {
                final androidController =
                    controller.platform as AndroidWebViewController;
                androidController.setOnShowFileSelector((params) async {
                  final result = await FilePicker.platform.pickFiles(
                    type: FileType.custom,
                    allowedExtensions: ['pdf'],
                    allowMultiple: false,
                  );
                  if (result == null || result.files.isEmpty) {
                    return <String>[];
                  }
                  final path = result.files.single.path;
                  return path == null ? <String>[] : <String>[path];
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: controller),
                ),
              );
            }
          }
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android app icon
        run: dart run flutter_launcher_icons
      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Green-Star-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
