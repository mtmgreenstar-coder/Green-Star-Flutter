name: Build Green Star APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare HTML and Flutter project
        run: |
          unzip -o Green-Star-Android-Source.zip
          mkdir -p assets/www
          cp www/index.html assets/www/index.html
          flutter create --platforms=android --org com.greenstar --project-name green_star .
          cat > pubspec.yaml <<'EOF'
          name: green_star
          description: Green Star Android app
          publish_to: 'none'
          version: 1.0.1+2
          environment:
            sdk: '>=3.8.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            in_app_webview_flutter: ^1.0.0
            file_picker: ^10.3.3
            url_launcher: ^6.3.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/www/
          EOF
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:in_app_webview_flutter/flutter_inappwebview.dart';
          import 'package:url_launcher/url_launcher.dart';

          void main() => runApp(const GreenStarApp());

          class GreenStarApp extends StatelessWidget {
            const GreenStarApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: GreenStarHome(),
              );
            }
          }

          class GreenStarHome extends StatefulWidget {
            const GreenStarHome({super.key});

            @override
            State<GreenStarHome> createState() => _GreenStarHomeState();
          }

          class _GreenStarHomeState extends State<GreenStarHome> {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: InAppWebView(
                    initialFile: 'assets/www/index.html',
                    initialSettings: InAppWebViewSettings(
                      javaScriptEnabled: true,
                      useWideViewPort: true,
                      loadWithOverviewMode: true,
                      supportZoom: true,
                      builtInZoomControls: true,
                      displayZoomControls: false,
                      allowFileAccess: true,
                      allowContentAccess: true,
                      useOnShowFileChooser: true,
                      useOnDownloadStart: true,
                    ),
                    onShowFileChooser: (controller, request) async {
                      final result = await FilePicker.platform.pickFiles(
                        allowMultiple: false,
                        withData: false,
                      );
                      if (result == null) {
                        return ShowFileChooserResponse(
                          filePaths: null,
                          handledByClient: true,
                        );
                      }
                      final paths = result.files
                          .where((file) => file.path != null)
                          .map((file) => Uri.file(file.path!).toString())
                          .toList();
                      return ShowFileChooserResponse(
                        filePaths: paths.isEmpty ? null : paths,
                        handledByClient: true,
                      );
                    },
                    onDownloadStartRequest: (controller, request) async {
                      final uri = Uri.tryParse(request.url.toString());
                      if (uri != null &&
                          (uri.scheme == 'https' || uri.scheme == 'http')) {
                        await launchUrl(uri, mode: LaunchMode.externalApplication);
                      }
                    },
                    onPrintRequest: (controller, url, printJobController) async {
                      // Let Android's native WebView print service handle window.print().
                      return false;
                    },
                  ),
                ),
              );
            }
          }
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Green-Star-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
